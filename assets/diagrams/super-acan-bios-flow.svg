<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Super A'Can 68k BIOS 控制流程與中斷向量</title>
  <desc id="desc">從 reset vector、UMC6650 測試、卡帶授權到 overlay 關閉及卡帶轉交，並顯示所有 BIOS exception 與 interrupt handler 均為 RTE stub。</desc>
  <defs>
    <style>
      .bg{fill:#10151d}.panel{fill:#17212d;stroke:#51657a;stroke-width:2}.node{fill:#213246;stroke:#78a9d1;stroke-width:2}.ok{fill:#173d36;stroke:#5ed0a5;stroke-width:2}.warn{fill:#49351d;stroke:#e8b15a;stroke-width:2}.irq{fill:#34254a;stroke:#bd8ee8;stroke-width:2}.title{fill:#f3f6fa;font:700 28px sans-serif}.head{fill:#e7edf4;font:700 20px sans-serif}.text{fill:#d9e2ec;font:16px sans-serif}.small{fill:#b9c6d3;font:14px sans-serif}.mono{fill:#f0f4f8;font:15px monospace}.arrow{stroke:#91a4b8;stroke-width:3;fill:none;marker-end:url(#m)}.dash{stroke:#e8b15a;stroke-width:3;stroke-dasharray:9 7;fill:none;marker-end:url(#mw)}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#91a4b8"/></marker>
    <marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e8b15a"/></marker>
  </defs>
  <rect class="bg" width="1200" height="1500"/>
  <text class="title" x="600" y="46" text-anchor="middle">Super A'Can 68k BIOS 控制流程</text>
  <text class="small" x="600" y="72" text-anchor="middle">internal_68k.bin · word-swapped address space · SHA-256 2e4d88be…c695d7c</text>

  <rect class="panel" x="45" y="95" width="730" height="1360" rx="18"/>
  <text class="head" x="410" y="128" text-anchor="middle">Reset／授權／卡帶轉交</text>

  <rect class="node" x="165" y="150" width="490" height="80" rx="12"/>
  <text class="mono" x="410" y="180" text-anchor="middle">Vector 0/1 → SSP=$00FD000A, PC=$00000400</text>
  <text class="text" x="410" y="207" text-anchor="middle">Supervisor mode，SR interrupt mask=7</text>

  <path class="arrow" d="M410 230V267"/>
  <rect class="node" x="165" y="268" width="490" height="86" rx="12"/>
  <text class="mono" x="410" y="298" text-anchor="middle">$400 NOP → $402 JSR $40A</text>
  <text class="text" x="410" y="326" text-anchor="middle">設定 UMC6650 address/data ports 與 Work RAM buffer</text>

  <path class="arrow" d="M410 354V391"/>
  <rect class="node" x="130" y="392" width="560" height="112" rx="12"/>
  <text class="mono" x="410" y="422" text-anchor="middle">$430–$48D UMC6650 RAM self-test</text>
  <text class="text" x="410" y="450" text-anchor="middle">備份 $40–$5F → 寫 address pattern → readback</text>
  <text class="text" x="410" y="478" text-anchor="middle">驗證後恢復原 32 bytes</text>

  <path class="arrow" d="M410 504V541"/>
  <rect class="node" x="130" y="542" width="560" height="126" rx="12"/>
  <text class="mono" x="410" y="572" text-anchor="middle">$48E–$554 UMC6650 key validation</text>
  <text class="text" x="410" y="600" text-anchor="middle">反向讀 $2F–$20 → ASCII anchors＋四組 checksum</text>
  <text class="text" x="410" y="628" text-anchor="middle">成功：internal $09←$FF，$0C←$00</text>
  <text class="small" x="410" y="651" text-anchor="middle">任何比較失敗 → $548 punishment／obfuscation path</text>

  <path class="arrow" d="M410 668V705"/>
  <rect class="node" x="130" y="706" width="560" height="118" rx="12"/>
  <text class="mono" x="410" y="736" text-anchor="middle">$55A–$574 License stage 1</text>
  <text class="text" x="410" y="764" text-anchor="middle">卡帶 $2000 vs BIOS $954，逐 word 比對 64 words</text>
  <text class="small" x="410" y="792" text-anchor="middle">不符 → $548</text>

  <path class="arrow" d="M410 824V861"/>
  <rect class="node" x="130" y="862" width="560" height="126" rx="12"/>
  <text class="mono" x="410" y="892" text-anchor="middle">$578–$5F0 License stage 2</text>
  <text class="text" x="410" y="920" text-anchor="middle">20-round signed MULS／carry checksum</text>
  <text class="text" x="410" y="948" text-anchor="middle">比對 BIOS byte＋longword tables</text>
  <text class="small" x="410" y="973" text-anchor="middle">任何差異 → $548</text>

  <path class="dash" d="M130 925H86V605H130"/>
  <rect class="warn" x="62" y="520" width="150" height="70" rx="10"/>
  <text class="mono" x="137" y="548" text-anchor="middle">$548 DBLE</text>
  <text class="small" x="137" y="572" text-anchor="middle">終態仍未知</text>

  <path class="arrow" d="M410 988V1025"/>
  <rect class="ok" x="130" y="1026" width="560" height="86" rx="12"/>
  <text class="mono" x="410" y="1056" text-anchor="middle">$5F4 success → $5FE JMP $F80604</text>
  <text class="text" x="410" y="1084" text-anchor="middle">轉到 BIOS high mirror</text>

  <path class="arrow" d="M410 1112V1149"/>
  <rect class="ok" x="130" y="1150" width="560" height="126" rx="12"/>
  <text class="mono" x="410" y="1180" text-anchor="middle">$F80604–$F8061E overlay handoff</text>
  <text class="text" x="410" y="1208" text-anchor="middle">bit1 關 low overlay → 從卡帶 $0/$4 載入 SSP/PC</text>
  <text class="text" x="410" y="1236" text-anchor="middle">bit3 關 high overlay</text>
  <text class="small" x="410" y="1261" text-anchor="middle">$F80620 JMP (A0) 必須已在 68000 prefetch queue</text>

  <path class="arrow" d="M410 1276V1313"/>
  <rect class="ok" x="165" y="1314" width="490" height="82" rx="12"/>
  <text class="mono" x="410" y="1345" text-anchor="middle">$620 JMP (A0)</text>
  <text class="text" x="410" y="1373" text-anchor="middle">進入卡帶向量入口；後續 IRQ 由卡帶處理</text>

  <rect class="panel" x="805" y="95" width="350" height="1360" rx="18"/>
  <text class="head" x="980" y="128" text-anchor="middle">BIOS exception／IRQ</text>

  <rect class="irq" x="835" y="158" width="290" height="145" rx="12"/>
  <text class="mono" x="980" y="188" text-anchor="middle">Vectors 2–24</text>
  <text class="text" x="980" y="218" text-anchor="middle">exceptions＋spurious</text>
  <text class="mono" x="980" y="252" text-anchor="middle">→ $622 RTE</text>
  <text class="small" x="980" y="281" text-anchor="middle">沒有 fault recovery</text>

  <rect class="irq" x="835" y="335" width="290" height="272" rx="12"/>
  <text class="mono" x="980" y="366" text-anchor="middle">Autovectors 25–31</text>
  <text class="mono" x="980" y="402" text-anchor="middle">L1 → $624 RTE</text>
  <text class="mono" x="980" y="431" text-anchor="middle">L2 → $626 RTE</text>
  <text class="mono" x="980" y="460" text-anchor="middle">L3 → $628 RTE</text>
  <text class="mono" x="980" y="489" text-anchor="middle">L4 → $62A RTE</text>
  <text class="mono" x="980" y="518" text-anchor="middle">L5 → $62C RTE</text>
  <text class="mono" x="980" y="547" text-anchor="middle">L6 → $62E RTE</text>
  <text class="mono" x="980" y="576" text-anchor="middle">L7 → $630 RTE</text>

  <rect class="irq" x="835" y="639" width="290" height="145" rx="12"/>
  <text class="mono" x="980" y="670" text-anchor="middle">Vectors 32–255</text>
  <text class="text" x="980" y="700" text-anchor="middle">TRAP／reserved／user</text>
  <text class="mono" x="980" y="734" text-anchor="middle">→ $622 RTE</text>
  <text class="small" x="980" y="762" text-anchor="middle">無 dispatch／ack</text>

  <rect class="warn" x="835" y="830" width="290" height="220" rx="12"/>
  <text class="head" x="980" y="865" text-anchor="middle">執行期限制</text>
  <text class="text" x="980" y="905" text-anchor="middle">Reset mask=7</text>
  <text class="small" x="980" y="934" text-anchor="middle">L1–L6 正常不會受理</text>
  <text class="small" x="980" y="970" text-anchor="middle">L7 只立即 RTE</text>
  <text class="small" x="980" y="1006" text-anchor="middle">low overlay 關閉後</text>
  <text class="small" x="980" y="1030" text-anchor="middle">vectors 由卡帶接管</text>

  <rect class="node" x="835" y="1090" width="290" height="230" rx="12"/>
  <text class="head" x="980" y="1125" text-anchor="middle">不是 BIOS handler</text>
  <text class="text" x="980" y="1165" text-anchor="middle">UM6618 vblank/raster</text>
  <text class="text" x="980" y="1195" text-anchor="middle">68k mailbox IRQ6</text>
  <text class="text" x="980" y="1225" text-anchor="middle">65C02 IRQ/NMI</text>
  <text class="small" x="980" y="1265" text-anchor="middle">全部由卡帶上傳／</text>
  <text class="small" x="980" y="1289" text-anchor="middle">卡帶向量提供</text>

  <text class="small" x="980" y="1395" text-anchor="middle">證據：完整 vector bytes＋</text>
  <text class="small" x="980" y="1419" text-anchor="middle">$400–$630 線性反組譯</text>
</svg>
